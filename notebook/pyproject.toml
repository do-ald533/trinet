[project]
name = "trinet-notebook"
version = "1.0.0"
description = "TriNet: notebook de treino das tres redes de risco financeiro (inadimplencia de cartao, volatilidade de acoes, regime por grafico OHLC) - T2 CIC407. Projeto uv independente, fora do workspace da API. Uso educacional, nao e recomendacao de investimento."
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    # TensorFlow em CPU (sem [and-cuda]): o treino roda em CPU (PLANO v1.1)
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "jupyterlab==4.6.6",
    "ipykernel==7.4.0",
    "kagglehub==1.0.3",
    # apendice de exportacao (fora da area avaliada)
    "tf2onnx==1.17.0",
    "onnx>=1.21.0",
    "onnxruntime==1.31.1",
    "pillow==13.0.0",
    "trinet-contract",
]

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.uv.sources]
# usado SO no apendice de exportacao, dentro de try/except ImportError
trinet-contract = { path = "../contract", editable = true }
