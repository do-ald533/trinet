# Gitleaks configuration (CI: `gitleaks git` over the full history; local: `make scan`, pre-commit).
title = "TriNet gitleaks config"

[extend]
# Keep every rule of the pinned gitleaks release (v8.30.1) and only add narrow allowlists.
useDefault = true

[[allowlists]]
description = "Local virtual environments are never committed; they only matter for `gitleaks dir`."
paths = ['''(^|/)\.venv/''']

[[allowlists]]
description = "Deterministic fake API keys used by the API test-suite: the valid test key and deliberately wrong keys for the 401 tests (not credentials)."
condition = "AND"
regexTarget = "line"
paths = ['''^api/tests/''']
regexes = ['''test-api-key-0123456789abcdef''', '''wrong-key-0123456789''']
