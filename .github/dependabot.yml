# Dependabot version updates (security updates are separate and ignore `cooldown`).
# `cooldown` delays every new release by N days, so a freshly published (possibly hijacked)
# version is never adopted immediately - the lesson of the 2026 trivy-action tag rewrite.
# Notes:
# - The pinned python:3.13-slim-trixie base and the uv image are literal FROM lines, so Dependabot
#   keeps their digests fresh. No workflow reads a secret other than the built-in GITHUB_TOKEN, so
#   Dependabot pull requests run exactly the same jobs as any other pull request.
version: 2

updates:
  # --- Python: root workspace (contract + api), production lock ---------------------------------
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"

  # --- Python: notebook project (TensorFlow stack, independent lock) -----------------------------
  # Frozen for the course deliverable: monthly, and TensorFlow/Keras are only bumped by hand.
  - package-ecosystem: uv
    directory: /notebook
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: tensorflow
      - dependency-name: keras
    groups:
      notebook-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, notebook]
    commit-message:
      prefix: "chore(notebook-deps)"

  # --- Container: Dockerfile base images (python slim, uv) and compose (Prometheus) ----
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"

  # --- GitHub Actions: SHA pins are refreshed together with their `# vX.Y.Z` comments -----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"

  # --- pre-commit hook revisions -------------------------------------------------------------------
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(hooks)"
