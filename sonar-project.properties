# SonarQube Cloud - ADVISORY only (PLANO §8.1): the job in ci.yml is not part of `ci-gate`, and the
# Free plan's "Sonar way" quality gate cannot be customised (it also fails the first analysis).
#
# TODO(user): confirm both keys against the project created at sonarcloud.io - they are
# placeholders derived from the local account name.
sonar.organization=doald533
sonar.projectKey=doald533_trinet
sonar.projectName=trinet

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Production code and the CI helper; tests are declared separately so they count as tests.
sonar.sources=contract/src,api/src,tools
sonar.tests=contract/tests,api/tests
sonar.test.inclusions=**/tests/**

# The notebook is out of scope (exploratory, TensorFlow stack, excluded everywhere else too).
sonar.exclusions=notebook/**,artifacts/**,**/__pycache__/**,**/.venv/**,contract/schema/**

# Coverage comes from the `tests + coverage` job (coverage.xml artifact, downloaded before the scan).
# Tip: [tool.coverage.run] relative_files = true in pyproject.toml makes the paths match.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,tools/**
